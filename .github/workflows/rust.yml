name: Rust

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Pinned Nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-29
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets --all-features --verbose
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run fmt check
        run: cargo fmt --all -- --check

  canary:
    name: Floating Nightly Canary
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests except trybuild snapshots
        run: rustup run nightly cargo test --all-targets --all-features --verbose -- --skip invalid_programs_fail_to_compile
      - name: Run trybuild canary
        continue-on-error: true
        run: rustup run nightly cargo test -p tml --test compile_fail --verbose
      - name: Run clippy
        run: rustup run nightly cargo clippy --all-targets --all-features -- -D warnings
      - name: Run fmt check
        run: rustup run nightly cargo fmt --all -- --check
