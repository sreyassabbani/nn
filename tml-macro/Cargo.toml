[package]
name = "tml-macro"
version = "0.3.0"
edition = "2024"
description = "Procedural macros for the tml machine learning library"
license = "MIT"
repository = "https://github.com/sreyassabbani/tml"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
