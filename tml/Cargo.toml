[package]
name = "tml"
version = "0.3.0"
edition = "2024"
authors = ["Sreyas Sabbani <sreyas.sabbani@gmail.com>"]
description = "Experimental, nightly-only, type-safe machine learning library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sreyassabbani/tml"
keywords = ["machine-learning", "tensor", "neural-network"]
categories = ["science", "mathematics"]

[dependencies]
tml-utils = { version = "0.3.0", path = "../tml-utils" }
tml-macro = { version = "0.3.0", path = "../tml-macro" }

[dev-dependencies]
criterion = "0.5"
trybuild = "1.0"

[features]
unstable = []

[[example]]
name = "linear-regression"
path = "./examples/linear_regression.rs"
required-features = ["unstable"]

[[example]]
name = "quadratic-regression"
path = "./examples/quadratic_regression.rs"

[[example]]
name = "multi-input"
path = "./examples/multi_input.rs"

[[example]]
name = "conv"
path = "./examples/conv.rs"

[[example]]
name = "conv_op"
path = "./examples/conv_op.rs"

[[bench]]
name = "conv"
harness = false
